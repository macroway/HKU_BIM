<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>CheckBIM Agent</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="titlebar">
    <strong>CheckBIM Agent</strong>
    <span>交付前碰撞与属性检查</span>
    <span class="badge" id="model-badge">未载入模型</span>
  </div>

  <div class="layout">
    <!-- 左：模型入口 -->
    <aside class="col">
      <div class="panel-label">模型入口</div>
      <div class="upload-compact" id="drop-zone">
        <button type="button" class="btn btn-primary" id="btn-upload">上传 IFC / JSON</button>
        <p>拖拽文件到此处</p>
        <input type="file" id="file-input" accept=".ifc,.ifczip,.json" />
      </div>
      <div class="panel-label">内置样例</div>
      <ul class="samples" id="sample-list"></ul>
      <p class="error" id="entry-error"></p>
    </aside>

    <!-- 中：可视化视口 -->
    <main class="col viewport-wrap">
      <div class="viewport-header">
        <h2>检查视口 · 平面俯视图</h2>
        <div class="legend">
          <span class="lg-wall">墙</span>
          <span class="lg-beam">梁</span>
          <span class="lg-pipe">管</span>
          <span class="lg-hit">冲突</span>
        </div>
      </div>
      <div class="canvas-box">
        <canvas id="plan-canvas"></canvas>
        <div class="canvas-empty" id="canvas-empty">载入模型后显示构件平面分布</div>
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="stat-elements">—</div>
          <div class="lbl">构件总数</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-collisions">—</div>
          <div class="lbl">碰撞对</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-attrs">—</div>
          <div class="lbl">缺失属性</div>
        </div>
      </div>
      <div class="results-grid">
        <div class="result-panel">
          <h3>碰撞清单</h3>
          <div class="result-list" id="collision-list">
            <div class="empty-hint">运行检查后显示</div>
          </div>
        </div>
        <div class="result-panel">
          <h3>属性缺失</h3>
          <div class="result-list" id="attr-list">
            <div class="empty-hint">运行检查后显示</div>
          </div>
        </div>
      </div>
    </main>

    <!-- 右：Agent -->
    <aside class="col col-agent">
      <div class="agent-header">
        <div class="agent-avatar">AI</div>
        <div class="meta">
          <strong>CheckBIM Agent</strong>
          <span id="llm-badge">加载规划器…</span>
        </div>
      </div>

      <div class="timeline">
        <div class="timeline-title">Agent 执行轨迹</div>
        <div class="timeline-steps" id="timeline-steps"></div>
      </div>

      <div class="panel-label">快捷指令</div>
      <div class="chips" id="chips"></div>

      <div class="panel-label">对话</div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="或输入自然语言…" disabled />
        <button type="button" class="btn btn-primary" id="btn-send" disabled>发送</button>
      </div>
      <div class="planner-tag" id="planner-tag">规划器 · 等待指令</div>
    </aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
